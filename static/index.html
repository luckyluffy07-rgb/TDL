<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TDL Chatbot</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262a36;
    --text: #e7e9ee;
    --muted: #8b90a0;
    --accent: #6c8cff;
    --bot: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; }
  #meta { color: var(--muted); font-size: 13px; margin-right: auto; }
  button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { color: var(--text); border-color: var(--accent); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: min(680px, 88%);
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .error { align-self: flex-start; background: #3a1d22; border: 1px solid #6d2b34; color: #ffc9d0; }
  .hint { color: var(--muted); text-align: center; margin: auto; font-size: 14px; }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 14px;
    font: inherit;
    max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); padding: 0 20px; }
  #send:disabled { opacity: .5; cursor: default; }
  .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px;
    background: var(--muted); border-radius: 50%; animation: b 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }
</style>
</head>
<body>
  <header>
    <h1>🤖 TDL Chatbot</h1>
    <span id="meta">connecting…</span>
    <button id="reset" type="button">New chat</button>
  </header>

  <div id="chat"><div class="hint">Ask me anything to get started.</div></div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message…  (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const meta = document.getElementById("meta");
let messages = [];

fetch("/api/info").then(r => r.json()).then(d => {
  meta.textContent = d.error ? d.error : `${d.provider} — ${d.model}`;
}).catch(() => { meta.textContent = "offline"; });

function addBubble(text, cls) {
  const hint = chat.querySelector(".hint");
  if (hint) hint.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById("reset").addEventListener("click", () => {
  messages = [];
  chat.innerHTML = '<div class="hint">Ask me anything to get started.</div>';
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;

  addBubble(text, "user");
  messages.push({ role: "user", content: text });
  input.value = "";
  input.style.height = "auto";
  send.disabled = true;

  const typing = addBubble("", "bot");
  typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages })
    });
    const data = await res.json();
    typing.remove();
    if (data.reply) {
      addBubble(data.reply, "bot");
      messages.push({ role: "assistant", content: data.reply });
    } else {
      addBubble(data.error || "Something went wrong.", "error");
      messages.pop();
    }
  } catch (err) {
    typing.remove();
    addBubble("🌐 Could not reach the server.", "error");
    messages.pop();
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
